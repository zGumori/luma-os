name: Build Luma OS ISO

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Variante"
        required: true
        default: luma
        type: choice
        options:
          - luma
          - luma-nvidia
          - luma-nvidia-legacy

env:
  IMAGE_TAG: stable
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  iso:
    name: ISO ${{ inputs.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Prepare config
        run: |
          owner="${{ github.repository_owner }}"
          ref="ghcr.io/${owner,,}/${{ inputs.image }}:${IMAGE_TAG}"
          echo "IMAGE_REF=${ref}" >> "$GITHUB_ENV"
          sed "s|@IMAGE_REF@|${ref}|g" disk_config/iso.toml > iso.toml
          cat iso.toml

      - name: Build ISO
        run: |
          mkdir -p output
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "${IMAGE_REF}"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v ./iso.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" \
            --type anaconda-iso \
            --use-librepo=True \
            "${IMAGE_REF}"
          sudo chown -R "$(id -u):$(id -g)" output
          iso="$(find output -name '*.iso' | head -1)"
          mv "${iso}" "output/${{ inputs.image }}-$(date -u +%Y%m%d).iso"
          (cd output && sha256sum ./*.iso > SHA256SUMS)
          ls -lh output

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image }}-iso
          path: |
            output/*.iso
            output/SHA256SUMS
          compression-level: 0
          retention-days: 7
