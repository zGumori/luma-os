name: Build Luma OS ISO

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Variante"
        required: true
        default: luma
        type: choice
        options:
          - luma
          - luma-nvidia
          - luma-nvidia-legacy

env:
  IMAGE_TAG: stable
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  iso:
    name: ISO ${{ inputs.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Generar la ISO necesita ~45 GB: se libera todo lo posible del runner
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Prepare work dir
        run: |
          df -h
          # Si el runner tiene un disco secundario en /mnt con espacio, se usa para el trabajo pesado
          avail_mnt=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          avail_root=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [[ -n "${avail_mnt}" && "${avail_mnt}" -gt "${avail_root}" ]]; then WORK=/mnt/luma; else WORK="${PWD}/work"; fi
          sudo mkdir -p "${WORK}/output" "${WORK}/store"
          echo "WORK=${WORK}" >> "$GITHUB_ENV"
          echo "Directorio de trabajo: ${WORK}"

      - name: Prepare config
        run: |
          owner="${{ github.repository_owner }}"
          ref="ghcr.io/${owner,,}/${{ inputs.image }}:${IMAGE_TAG}"
          echo "IMAGE_REF=${ref}" >> "$GITHUB_ENV"
          sed "s|@IMAGE_REF@|${ref}|g" disk_config/iso.toml > iso.toml
          cat iso.toml

      - name: Build ISO
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "${IMAGE_REF}"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${WORK}/output":/output \
            -v "${WORK}/store":/store \
            -v ./iso.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" \
            --type anaconda-iso \
            --use-librepo=True \
            --rootfs btrfs \
            "${IMAGE_REF}"
          # La caché de osbuild ya no hace falta: deja sitio para el artefacto
          sudo rm -rf "${WORK}/store"
          sudo chown -R "$(id -u):$(id -g)" "${WORK}/output"
          iso="$(find "${WORK}/output" -name '*.iso' | head -1)"
          mv "${iso}" "${WORK}/output/${{ inputs.image }}-$(date -u +%Y%m%d).iso"
          (cd "${WORK}/output" && sha256sum ./*.iso > SHA256SUMS)
          ls -lh "${WORK}/output"
          df -h

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image }}-iso
          path: |
            ${{ env.WORK }}/output/*.iso
            ${{ env.WORK }}/output/SHA256SUMS
          compression-level: 0
          retention-days: 7
