# Overlay de rendimiento de Luma (MangoHud) — estilo Luma Glass (docs/DESIGN.md).
# Oculto por defecto: se muestra y se oculta con Mayús derecha + F12.

no_display
toggle_hud=Shift_R+F12

# Una sola fila, arriba en el centro, como una píldora de cristal oscuro
horizontal
hud_compact
position=top-center
round_corners=14
background_color=14171F
background_alpha=0.6
font_size=18
text_color=F0F2F7

# Qué se muestra
fps
fps_color_change
fps_value=30,60
fps_color=E5323B,F5A524,21C07A
frametime=0
frame_timing=0
gpu_stats
gpu_temp
gpu_color=2F7BFF
cpu_stats
cpu_temp
cpu_color=F5A524
ram
vram
vram_color=8B5CF6
ram_color=14B8E6
