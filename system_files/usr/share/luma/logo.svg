<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Orbe de cristal: degradado cian → índigo → violeta -->
    <linearGradient id="orb" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#5EEBFF"/>
      <stop offset="0.5" stop-color="#6A6CFF"/>
      <stop offset="1" stop-color="#C45CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="crescent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E8FF" stop-opacity="0.85"/>
    </linearGradient>
    <mask id="moon">
      <rect width="256" height="256" fill="black"/>
      <circle cx="128" cy="128" r="62" fill="white"/>
      <circle cx="154" cy="108" r="54" fill="black"/>
    </mask>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#orb)"/>
  <circle cx="128" cy="128" r="112" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="110.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- Luna creciente: la "luz" de Luma -->
  <rect width="256" height="256" fill="url(#crescent)" mask="url(#moon)"/>
  <circle cx="176" cy="84" r="7" fill="#FFFFFF" opacity="0.95"/>
</svg>
